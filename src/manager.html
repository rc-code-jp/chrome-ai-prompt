<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt Spark</title>
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 3.5c.62 5.3 1.9 7.6 8 8.25v.5c-6.1.65-7.38 2.95-8 8.25h-.5c-.62-5.3-1.9-7.6-8-8.25v-.5c6.1-.65 7.38-2.95 8-8.25h.5ZM18.6 1.5c.26 2.3.84 3.3 3.4 3.6v.4c-2.56.3-3.14 1.3-3.4 3.6h-.4c-.26-2.3-.84-3.3-3.4-3.6v-.4c2.56-.3 3.14-1.3 3.4-3.6h.4Z"/></svg>
      </div>
      <div class="brand">
        <h1>Prompt Spark</h1>
        <p>入力欄で <code>$$</code> と打つと呼び出せます</p>
      </div>
    </header>

    <section id="list-view" class="view">
      <div class="bar">
        <span class="eyebrow">MY PROMPTS <span id="count" class="tally"></span></span>
        <button id="add" class="btn primary sm" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
          新規作成
        </button>
      </div>
      <ul id="list" class="list"></ul>
      <div id="empty" class="empty" hidden>
        <div class="orb" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 3.5c.62 5.3 1.9 7.6 8 8.25v.5c-6.1.65-7.38 2.95-8 8.25h-.5c-.62-5.3-1.9-7.6-8-8.25v-.5c6.1-.65 7.38-2.95 8-8.25h.5ZM18.6 1.5c.26 2.3.84 3.3 3.4 3.6v.4c-2.56.3-3.14 1.3-3.4 3.6h-.4c-.26-2.3-.84-3.3-3.4-3.6v-.4c2.56-.3 3.14-1.3 3.4-3.6h.4Z"/></svg>
        </div>
        <p class="empty-title">最初のプロンプトを登録しましょう</p>
        <p class="empty-text">よく使う指示を保存しておくと、どのサイトの入力欄でも <code>$$</code> から呼び出せます。</p>
      </div>
    </section>

    <form id="edit-view" class="view edit" hidden>
      <div class="bar">
        <button id="back" class="icon-btn" type="button" aria-label="一覧に戻る">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14.7 5.3 16.1 6.7 10.8 12l5.3 5.3-1.4 1.4L8 12z"/></svg>
        </button>
        <span id="edit-label" class="eyebrow">NEW PROMPT</span>
      </div>
      <label class="field">
        <span>タイトル</span>
        <input id="title" type="text" maxlength="80" placeholder="例：要約して" autocomplete="off">
      </label>
      <label class="field grow">
        <span>プロンプト <em id="body-count" class="tally"></em></span>
        <textarea id="body" placeholder="$$ の位置に挿入されるテキスト"></textarea>
      </label>
      <p id="notice" class="notice" role="status" hidden></p>
      <div class="edit-actions">
        <button id="delete" class="btn danger" type="button" hidden>削除</button>
        <button id="cancel" class="btn ghost" type="button">キャンセル</button>
        <button id="save" class="btn primary" type="submit">保存 <kbd id="save-key"></kbd></button>
      </div>
    </form>
  </div>
  <script src="manager.js"></script>
</body>
</html>
